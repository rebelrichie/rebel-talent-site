# Rebel Talent Systems route handling.
# Include this file inside the server { } that serves /opt/fcc/static/rts.
# INSTALL_NGINX_CONF=1 ./deploy.sh does that, then runs nginx -t.
# It does not reload if the test fails.
#
# Prerendered pages are $uri/index.html.
# Job UUID redirects, /defense, legacy .html files, and the routes below
# are also real files. The 301s here win when this snippet is installed.
#
# A brand-new job or blog slug is not on disk until the next deploy.
# /jobs/ and /blog/ fall through to the SPA so those pages still render.
# Every other unknown path is a real 404.

error_page 404 /404.html;

location = /results { return 301 /case-studies; }
location = /pricing { return 301 /services; }
location = /platform { return 301 /services; }
location = /how-it-works { return 301 /services; }
location = /fractional-head-of-talent { return 301 /fractional; }
location = /fractional-recruiting-services { return 301 /fractional; }
location = /abcr-certification { return 301 /certification; }
location = /rachael { return 301 /; }
location = /command { return 301 /; }
location = /shop { return 301 https://rebel-talent-shop.fourthwall.com/; }

# Unknown slugs under /jobs/ and /blog/ fall through to index.html so the
# app can render them. That response is HTTP 200. The app shows the banded
# 404 view when the slug is not a real role or post. Other unknown paths
# are a real HTTP 404.

location /jobs/ {
    root /opt/fcc/static/rts;
    try_files $uri $uri/ $uri/index.html /index.html;
}

location /blog/ {
    root /opt/fcc/static/rts;
    try_files $uri $uri/ $uri/index.html /index.html;
}

location / {
    root /opt/fcc/static/rts;
    try_files $uri $uri/ $uri/index.html =404;
}
