# Rebel Talent Systems, nginx route handling.
# Docroot on the droplet: /opt/fcc/static/rts
#
# Prerender writes a real index.html for every public route, plus:
#   /jobs/<uuid>/index.html     HTML redirect to the slug URL
#   /defense/index.html         HTML redirect to /cleared
#   /how-it-works.html and the other legacy .html files
#   /404.html                   banded not-found page
#
# Unknown paths must not fall through to /index.html. That fallback
# returns HTTP 200 for pages that do not exist.
#
# Paste the two directives below into the existing server { } that
# already terminates TLS for rebeltalentsystems.com. Remove the old
# `try_files $uri $uri/ /index.html;` line. Do not add a second
# `location /` or nginx -t will fail.
#
#   error_page 404 /404.html;
#   try_files $uri $uri/ $uri/index.html =404;
#
# INSTALL_NGINX_CONF=1 ./deploy.sh applies this on the droplet,
# runs nginx -t, and reloads only if the test passes.

error_page 404 /404.html;

location / {
    root /opt/fcc/static/rts;
    try_files $uri $uri/ $uri/index.html =404;
}
