    <!-- Google Analytics (G-56NQCBZNP7) — config queued immediately, but the
         gtag library load is deferred to idle / first interaction so its
         ~160KB download+exec doesn't compete with React hydration on load.
         The pageview still records once the library loads and flushes dataLayer. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-56NQCBZNP7');
      (function () {
        function loadGA() {
          if (window.__gaLoaded) return;
          window.__gaLoaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-56NQCBZNP7';
          document.head.appendChild(s);
        }
        var ric = window.requestIdleCallback || function (cb) { return setTimeout(cb, 2000); };
        ric(loadGA, { timeout: 4000 });
        ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(function (evt) {
          window.addEventListener(evt, loadGA, { once: true, passive: true });
        });
      })();
    </script>
