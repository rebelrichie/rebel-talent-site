name: Build & Deploy Marketing Site

on:
  # Manual trigger (and webhook target — Next.js calls this via workflow_dispatch)
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this run was triggered (for the logs)"
        required: false
        default: "manual"

  # Nightly fallback — 3:00 AM ET (07:00 UTC standard / 08:00 UTC during DST).
  # Picks 07:30 UTC as a compromise that's always pre-business-hours on the east coast.
  schedule:
    - cron: "30 7 * * *"

  # Auto-rebuild whenever the source changes
  push:
    branches: [main]

concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site (Vite + prerender)
        env:
          # Prerender's Puppeteer fetches the live API for the /jobs page so the
          # baked HTML contains current roles at the moment of build.
          NODE_ENV: production
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 64.225.2.41 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            dist/public/ \
            root@64.225.2.41:/opt/fcc/static/rts/

      - name: Report
        if: success()
        run: echo "Marketing site deployed. Trigger reason: ${{ inputs.reason || github.event_name }}"
